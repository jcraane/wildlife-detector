[project]
name = "wildcam"
version = "0.1.0"
description = "Find animals, people and vehicles in trail camera footage with MegaDetector"
authors = [
    { name = "jamiecraane", email = "jcraane@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "megadetector>=10.0.25",
    "numpy>=2.5.3",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "tqdm>=4.70.1",
]

[project.scripts]
wildcam = "wildcam:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"


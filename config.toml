# wildcam configuration. Every value can be overridden on the command line
# (see `uv run wildcam --help`).

# Footage folder, scanned recursively. Opened read-only: nothing in it is ever
# modified, moved or deleted. Put your own path in config.local.toml (not in
# git), which overrides any value in this file.
input_dir = "~/WildlifeCamera"

# Where results.csv/json, the sorted/ symlink view and report.html are written.
output_dir = "output"

# Per-file detection cache, shared by all runs. Keyed by file content, so
# moved or renamed footage keeps its results and labels.
cache_dir = "cache"

[detect]
# MegaDetector model name as understood by the `megadetector` package.
model = "MDV1000-REDWOOD"
# Frames sampled per second of video.
fps = 1.0
# Sampled frames are scaled to this width before detection. MegaDetector
# resizes to 1280 px internally, so 1920 loses no detection accuracy.
frame_width = 1920
# Detections at or above this confidence are cached. Thresholds below this
# value need a re-run of detection (`--redetect`).
min_cached_conf = 0.01
# Parallel file loaders (ffmpeg decoding / JPEG decoding) feeding the GPU.
workers = 4

[aggregate]
# A file is a hit when any detection in any frame reaches this confidence.
threshold = 0.2

# Per-category overrides of `threshold`. People and vehicles are not expected
# at these locations (except the owner servicing the camera), and close-up
# rabbits score up to ~0.6 as "person", so these are stricter.
[aggregate.category_thresholds]
person = 0.7
vehicle = 0.8

[species]
# Label every animal hit with BioCLIP-2 (zero-shot): each MegaDetector animal
# box on the best frame is compared against the labels below and gets the
# best-matching one. Only these labels can be returned, so list what can
# plausibly visit the camera. There is no reliable "no animal" label: BioCLIP-2
# rates any species name above generic background prompts, so MegaDetector
# false positives get the closest species. Mouse and rat species can't be told
# apart reliably on night footage, so there is a single "house mouse" label.
enabled = true
model = "hf-hub:imageomics/bioclip-2"

# Your corrections, exported from the report ("Export labels"). With examples
# for two or more labels, a classifier is trained on them and predicts the
# labelled classes (including ones not listed below, such as "no animal" or
# "rabbit on lens"). A file labelled "no animal" stops counting as an animal hit.
labels_file = "labels.csv"
# A zero-shot label that has no examples yet is still used when it scores at
# least this high (so a rare visitor is not forced into a trained class).
zero_shot_min = 0.9

# label = text prompt(s). BioCLIP-2 works best with "scientific name, common
# name". A list of prompts is averaged. Changing labels only needs
# `uv run wildcam species` again: crops are cached, re-scoring takes seconds.
[species.labels]
"domestic rabbit" = [
    "Oryctolagus cuniculus domesticus, domestic rabbit",
    "Oryctolagus cuniculus domesticus, black and white Dutch rabbit",
    "Oryctolagus cuniculus domesticus, close-up of domestic rabbit fur",
]
"house mouse" = "Mus musculus, house mouse"
"domestic cat" = "Felis catus, domestic cat"
"red squirrel" = "Sciurus vulgaris, red squirrel"
"hedgehog" = "Erinaceus europaeus, European hedgehog"
"red fox" = "Vulpes vulpes, red fox"
"stone marten" = "Martes foina, stone marten"
"European robin" = "Erithacus rubecula, European robin"
"Eurasian blackbird" = "Turdus merula, Eurasian blackbird"
"house sparrow" = "Passer domesticus, house sparrow"
"great tit" = "Parus major, great tit"
"wood pigeon" = "Columba palumbus, common wood pigeon"
"Eurasian magpie" = "Pica pica, Eurasian magpie"
"human" = "Homo sapiens, human"
